name: Deploy Landing Page

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            REPO_DIR="/var/www/palmandplate-landing"
            REPO_URL="https://github.com/Suhaib5333/palmandplate-landingpage.git"

            # Clone or pull
            if [ ! -d "$REPO_DIR" ]; then
              git clone "$REPO_URL" "$REPO_DIR"
            else
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$REPO_DIR"

            # Write production env vars
            cat > .env <<EOF
            PUBLIC_MEMBER_APP_URL=http://${{ secrets.VPS_HOST }}:5173
            PUBLIC_API_URL=http://${{ secrets.VPS_HOST }}:3000
            EOF
            sed -i 's/^[[:space:]]*//' .env

            # Install and build
            npm ci
            npm run build

            # Serve with PM2 (static file server on port 4321)
            if pm2 describe palmandplate-landing > /dev/null 2>&1; then
              pm2 restart palmandplate-landing
            else
              npx pm2 serve dist 4321 --name palmandplate-landing --spa
            fi

            pm2 save
